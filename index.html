<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お小遣いアプリ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:12px;
    color:#000;
}

h1{
    text-align:center;
    margin:0 0 15px;
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }
}

.card{
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.aoi{
    background:#dbeafe;
    border:2px solid #2563eb;
}

.yume{
    background:#fef9c3;
    border:2px solid #eab308;
}

.name{
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.label{
    text-align:center;
    margin-top:10px;
    font-size:14px;
}

.total{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-bottom:10px;
}

.plus-row,
.minus-row{
    display:grid;
    gap:8px;
    margin-bottom:8px;
}

.plus-row{
    grid-template-columns:repeat(4,1fr);
}

.minus-row{
    grid-template-columns:repeat(4,1fr);
}

.money-btn{
    border:none;
    border-radius:10px;
    height:50px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.plus{
    background:#dbeafe;
    color:#1d4ed8;
}

.bonus{
    background:#dcfce7;
    color:#15803d;
}

.minus-small{
    background:#fed7aa;
    color:#c2410c;
}

.minus-big{
    background:#fee2e2;
    color:#b91c1c;
}

.undo-btn{
    background:#64748b;
    color:#fff;
}

.reset-btn-small{
    background:#ef4444;
    color:#fff;
}

details{
    margin-top:12px;
}

.history{
    margin-top:8px;
    background:#fff;
    border-radius:10px;
    padding:10px;
    max-height:250px;
    overflow:auto;
}

.month{
    border-bottom:1px solid #ddd;
    margin-bottom:10px;
    padding-bottom:10px;
}
</style>
</head>

<body>

<h1>お小遣いアプリ</h1>

<div class="container">

<div class="card aoi">

    <div class="name">🔵 碧唯</div>

    <div class="label">今日の合計</div>
    <div class="total" id="aoiToday">0円</div>

    <div class="label">今月の合計</div>
    <div class="total" id="aoiMonth">0円</div>

    <div class="plus-row">
        <button class="money-btn plus" onclick="addMoney('aoi',10)">+10</button>
        <button class="money-btn plus" onclick="addMoney('aoi',20)">+20</button>
        <button class="money-btn plus" onclick="addMoney('aoi',50)">+50</button>
        <button class="money-btn bonus" onclick="addMoney('aoi',100)">+100</button>
    </div>

    <div class="minus-row">
        <button class="money-btn minus-small" onclick="addMoney('aoi',-20)">-20</button>
        <button class="money-btn minus-big" onclick="addMoney('aoi',-100)">-100</button>
        <button class="money-btn undo-btn" onclick="undoLast('aoi')">↩戻す</button>
        <button class="money-btn reset-btn-small" onclick="resetChild('aoi')">🗑</button>
    </div>

    <details>
        <summary>月別履歴を見る</summary>
        <div class="history" id="aoiHistory"></div>
    </details>

</div>

<div class="card yume">

    <div class="name">🟡 優芽</div>

    <div class="label">今日の合計</div>
    <div class="total" id="yumeToday">0円</div>

    <div class="label">今月の合計</div>
    <div class="total" id="yumeMonth">0円</div>

    <div class="plus-row">
        <button class="money-btn plus" onclick="addMoney('yume',10)">+10</button>
        <button class="money-btn plus" onclick="addMoney('yume',20)">+20</button>
        <button class="money-btn plus" onclick="addMoney('yume',50)">+50</button>
        <button class="money-btn bonus" onclick="addMoney('yume',100)">+100</button>
    </div>

    <div class="minus-row">
        <button class="money-btn minus-small" onclick="addMoney('yume',-20)">-20</button>
        <button class="money-btn minus-big" onclick="addMoney('yume',-100)">-100</button>
        <button class="money-btn undo-btn" onclick="undoLast('yume')">↩戻す</button>
        <button class="money-btn reset-btn-small" onclick="resetChild('yume')">🗑</button>
    </div>

    <details>
        <summary>月別履歴を見る</summary>
        <div class="history" id="yumeHistory"></div>
    </details>

</div>

</div>

<script>

let data = JSON.parse(
    localStorage.getItem("allowanceData")
) || {
    aoi:[],
    yume:[]
};

function save(){
    localStorage.setItem(
        "allowanceData",
        JSON.stringify(data)
    );
}

function addMoney(child,amount){

    data[child].push({
        money:amount,
        date:new Date().toISOString()
    });

    save();
    render();
}

function undoLast(child){

    if(data[child].length === 0){
        return;
    }

    data[child].pop();

    save();
    render();
}

function resetChild(child){

    data[child] = [];

    save();
    render();
}

function render(){

    ["aoi","yume"].forEach(child=>{

        let todayTotal = 0;
        let monthTotal = 0;

        const now = new Date();

        let months = {};

        data[child].forEach(item=>{

            const d = new Date(item.date);

            if(
                d.toDateString() === now.toDateString()
            ){
                todayTotal += item.money;
            }

            if(
                d.getFullYear() === now.getFullYear() &&
                d.getMonth() === now.getMonth()
            ){
                monthTotal += item.money;
            }

            const key =
                d.getFullYear() + "年" +
                String(d.getMonth()+1).padStart(2,"0") +
                "月";

            if(!months[key]){
                months[key] = [];
            }

            months[key].push(item);

        });

        document.getElementById(child+"Today")
            .textContent = todayTotal + "円";

        document.getElementById(child+"Month")
            .textContent = monthTotal + "円";

        let html = "";

        Object.keys(months)
            .sort()
            .reverse()
            .forEach(month=>{

                let total = 0;

                html += `
                <div class="month">
                <strong>${month}</strong><br>
                `;

                months[month].forEach(item=>{

                    total += item.money;

                    html += `
                    ${item.money > 0 ? '+' : ''}
                    ${item.money}円<br>
                    `;
                });

                html += `
                <strong>合計 ${total}円</strong>
                </div>
                `;
            });

        if(html === ""){
            html = "履歴なし";
        }

        document.getElementById(
            child + "History"
        ).innerHTML = html;

    });

}

render();

</script>

</body>
</html>
