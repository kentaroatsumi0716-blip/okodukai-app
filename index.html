<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お小遣い計算アプリ</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
    color:#000;
}

h1{
    text-align:center;
    color:#000;
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }
}

.card{
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.aoi{
    background:#dbeafe;
    border:2px solid #2563eb;
}

.yume{
    background:#fef9c3;
    border:2px solid #eab308;
}

.name{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
    color:#000;
}

.total{
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
    color:#000;
}

button{
    width:100%;
    padding:12px;
    margin-bottom:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    color:#000;
}

.job-btn{
    background:#fff;
}

.job-btn:hover{
    background:#f0f0f0;
}

.reset-btn{
    background:#ef4444;
    color:#fff;
}

.history{
    margin-top:15px;
    background:white;
    border-radius:10px;
    padding:10px;
    max-height:300px;
    overflow-y:auto;
    color:#000;
}

.month-block{
    border-bottom:1px solid #ddd;
    margin-bottom:10px;
    padding-bottom:10px;
}
</style>
</head>

<body>

<h1>お小遣い計算アプリ</h1>

<div class="container">

    <div class="card aoi">
        <div class="name">🔵 碧唯</div>

        <div>今日の合計</div>
        <div class="total" id="aoiToday">0円</div>

        
        <div>今月の合計</div>
        <div class="total" id="aoiMonth">0円</div>

        <div id="aoiJobs"></div>

        <button class="reset-btn" onclick="resetChild('aoi')">
            履歴リセット
        </button>

        <div class="history" id="aoiHistory"></div>
    </div>

    <div class="card yume">
        <div class="name">🟡 優芽</div>

        <div>今日の合計</div>
        <div class="total" id="yumeToday">0円</div>

        <div>今月の合計</div>
        <div class="total" id="yumeMonth">0円</div>

        <div id="yumeJobs"></div>

        <button class="reset-btn" onclick="resetChild('yume')">
            履歴リセット
        </button>

        <div class="history" id="yumeHistory"></div>
    </div>

</div>

<script>

const jobs = [
    {name:"掃除機",money:20},
    {name:"風呂掃除",money:20},
    {name:"草取り",money:20},
    {name:"皿洗い",money:20},
    {name:"トイレ掃除",money:50},
    {name:"テレビ台拭き掃除",money:20},
    {name:"減給",money:-50},
];

let data = JSON.parse(localStorage.getItem("allowanceData")) || {
    aoi:[],
    yume:[]
};

function save(){
    localStorage.setItem("allowanceData",JSON.stringify(data));
}

function createButtons(){

    ["aoi","yume"].forEach(child=>{

        const area = document.getElementById(child+"Jobs");

        jobs.forEach(job=>{

            const btn = document.createElement("button");

            btn.className = "job-btn";
            btn.innerHTML = `${job.name} (+${job.money}円)`;

            btn.onclick = ()=>{

                data[child].push({
                    job:job.name,
                    money:job.money,
                    date:new Date().toISOString()
                });

                save();
                render();
            };

            area.appendChild(btn);
        });
    });
}

function render(){

    ["aoi","yume"].forEach(child=>{

        const today = new Date().toLocaleDateString();

        let todayTotal = 0;
        let monthTotal = 0;

        let monthGroup = {};

        data[child].forEach(item=>{

            const d = new Date(item.date);

            if(d.toLocaleDateString() === today){
                todayTotal += item.money;
            }

            const now = new Date();

            if(
                d.getFullYear() === now.getFullYear() &&
                d.getMonth() === now.getMonth()
            ){
                monthTotal += item.money;
            }

            const monthKey =
                d.getFullYear() + "年" +
                String(d.getMonth()+1).padStart(2,"0") + "月";

            if(!monthGroup[monthKey]){
                monthGroup[monthKey] = [];
            }

            monthGroup[monthKey].push(item);
        });

        document.getElementById(child+"Today").textContent =
            todayTotal + "円";

        document.getElementById(child+"Month").textContent =
            monthTotal + "円";

        const historyDiv = document.getElementById(child+"History");

        let html = "<h3>月別履歴</h3>";

        const months =
            Object.keys(monthGroup).sort().reverse();

        months.forEach(month=>{

            let total = 0;

            html += `<div class="month-block">
                        <strong>${month}</strong><br>`;

            monthGroup[month].forEach(item=>{

                total += item.money;

                html += `
                    ${item.job}
                    (+${item.money}円)<br>
                `;
            });

            html += `
                <strong>合計 ${total}円</strong>
                </div>
            `;
        });

        if(months.length === 0){
            html = "履歴なし";
        }

        historyDiv.innerHTML = html;
    });
}

function resetChild(child){

    if(confirm("履歴を全て削除しますか？")){

        data[child] = [];

        save();
        render();
    }
}

createButtons();
render();

</script>

</body>
</html>
